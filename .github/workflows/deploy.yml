# Deploys public/ to Cloudflare Pages on every push.
#   main            -> production (www.performancehealthgroup.org once the custom domain is attached)
#   any other branch -> a preview deployment at <branch>.performancehealthgroup.pages.dev
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   - API token with "Cloudflare Pages: Edit" on the account
#   CLOUDFLARE_ACCOUNT_ID  - the account id shown on the Workers & Pages overview page
# Until they exist the workflow only checks the site and reports that nothing was deployed.
name: Deploy to Cloudflare Pages

on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: performancehealthgroup
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the shared header and footer are in sync
        run: node tools/sync-chrome.mjs --check

      - name: Report when the Cloudflare secrets are not configured
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set as repository secrets - site checked, nothing deployed."

      - name: Create the Pages project if it does not exist yet
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: |
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects"
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base/$PROJECT")
          if [ "$code" = "404" ]; then
            curl -sf -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' \
              "$base" -d "{\"name\":\"$PROJECT\",\"production_branch\":\"main\"}" > /dev/null
            echo "Created Pages project $PROJECT"
          elif [ "$code" != "200" ]; then
            echo "Cloudflare API returned HTTP $code for project $PROJECT" >&2; exit 1
          fi

      - name: Deploy public/
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: |
          npx --yes wrangler@4 pages deploy public \
            --project-name "$PROJECT" \
            --branch "$GITHUB_REF_NAME" \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "$(git log -1 --pretty=%s)"
